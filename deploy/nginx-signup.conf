# 活动报名 · nginx 反向代理（国内主机）
#
#   sudo cp deploy/nginx-signup.conf /etc/nginx/conf.d/signup.conf
#   # 把 events.example.com 换成你已备案的域名，证书路径换成实际路径
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书：腾讯云/阿里云控制台可以免费申请一年期 DV 证书，或用 certbot：
#   sudo certbot --nginx -d events.example.com

server {
    listen 80;
    server_name events.example.com;

    # 备案接入检查和 certbot 验证走 http，其余一律跳 https
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name events.example.com;

    ssl_certificate     /etc/nginx/ssl/events.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/events.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 报名表单和图片上传；600KB 的图加上表单字段，2m 足够
    client_max_body_size 2m;

    # 二维码 SVG 和活动配图可以放心缓存，内容按随机 id 寻址不会变
    location ~ ^/(f|api/se/qr)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_valid 200 1d;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # 应用靠这两个头拼出二维码里的绝对地址；漏了会把 127.0.0.1 印进二维码。
        # 保险起见 SE_PUBLIC_ORIGIN 也要设（它优先级更高）。
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
